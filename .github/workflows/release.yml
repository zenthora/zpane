name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/zpane.exe, README.md, LICENSE -DestinationPath dist/zpane-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip

  build-linux-packages:
    name: Arch (.pkg.tar.zst), Debian (.deb), Fedora (.rpm) & Termux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools zstd dpkg-dev fakeroot rpm
      - name: Build static Linux x86_64 and Termux aarch64 binaries
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Package Debian (.deb), Fedora (.rpm), Arch (.pkg.tar.zst), and Termux (.deb)
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-termux-packages
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
