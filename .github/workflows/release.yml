name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows (x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Set deterministic build metadata
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $epoch = (git log -1 --format=%ct 2>$null)
          if (-not $epoch -or $epoch -notmatch '^\d+$') {
            $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          }
          "SOURCE_DATE_EPOCH=$epoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $cargoToml = Get-Content -Raw -Path Cargo.toml
            if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $tag = "v$($Matches[1])"
            } else {
              throw "Unable to resolve package version from Cargo.toml"
            }
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.~+-][0-9A-Za-z.]+)?$') {
            throw "Invalid release tag format: $tag"
          }
          "ZPANE_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run unit tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Verify release binary
        shell: pwsh
        run: ./target/release/zpane.exe --version
      - name: Package Windows archive and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $distDir = (Resolve-Path dist).Path
          $zipName = "zpane-$($env:ZPANE_RELEASE_TAG)-x86_64-pc-windows-msvc.zip"
          $zipPath = Join-Path $distDir $zipName
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          $epochSec = [long]$env:SOURCE_DATE_EPOCH
          if ($epochSec -lt 315532800) {
            $epochSec = 315532800
          }
          $stamp = [DateTimeOffset]::FromUnixTimeSeconds($epochSec)
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $fs = [System.IO.File]::Open($zipPath, [System.IO.FileMode]::CreateNew)
          try {
            $zip = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create, $false)
            try {
              $entries = @(
                @{ Src = 'target/release/zpane.exe'; Name = 'zpane.exe' },
                @{ Src = 'README.md'; Name = 'README.md' },
                @{ Src = 'LICENSE'; Name = 'LICENSE' }
              )
              foreach ($item in $entries) {
                $entry = $zip.CreateEntry($item.Name, [System.IO.Compression.CompressionLevel]::SmallestSize)
                $entry.LastWriteTime = $stamp
                $srcStream = [System.IO.File]::OpenRead((Resolve-Path $item.Src).Path)
                try {
                  $dstStream = $entry.Open()
                  try {
                    $srcStream.CopyTo($dstStream)
                  } finally {
                    $dstStream.Dispose()
                  }
                } finally {
                  $srcStream.Dispose()
                }
              }
            } finally {
              $zip.Dispose()
            }
          } finally {
            $fs.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $distDir 'SHA256SUMS.windows'), "$hash  $zipName`n", [System.Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS.windows
          if-no-files-found: error

  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set deterministic build metadata
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct 2>/dev/null || date +%s)"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid SOURCE_DATE_EPOCH: ${epoch}" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.~+-][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: ${ver}" >&2
            exit 1
          fi
          echo "ZPANE_VERSION=${ver}" >> "${GITHUB_ENV}"
      - name: Run unit tests (native arm64 runner)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify release binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/zpane"
          expected="${{ matrix.target }}"
          expected="${expected%%-*}"
          if [[ "${expected}" == "aarch64" ]]; then
            expected="arm64"
            "${bin}" --version
          fi
          actual="$(lipo -archs "${bin}")"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Unexpected binary architecture '${actual}' (expected '${expected}')" >&2
            exit 1
          fi
      - name: Package deterministic macOS archive
        run: bash scripts/package-macos.sh "${ZPANE_VERSION}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS.macos-${{ matrix.target }}
          if-no-files-found: error

  build-linux-packages:
    name: Arch (.pkg.tar.zst), Debian (.deb), Fedora (.rpm) (x86_64 & arm64) & Termux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Set deterministic build metadata
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct 2>/dev/null || date +%s)"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "Invalid SOURCE_DATE_EPOCH: ${epoch}" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          if [[ ! "${ver}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.~+-][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid release version: ${ver}" >&2
            exit 1
          fi
          echo "ZPANE_VERSION=${ver}" >> "${GITHUB_ENV}"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools zstd dpkg-dev fakeroot rpm
      - name: Run unit tests
        run: cargo test --locked
      - name: Build static Linux x86_64 and aarch64 (arm64 / Termux) binaries
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          cargo build --release --locked --target aarch64-unknown-linux-musl
      - name: Verify static Linux x86_64 binary
        run: ./target/x86_64-unknown-linux-musl/release/zpane --version
      - name: Package Debian (.deb), Fedora (.rpm), Arch (.pkg.tar.zst) for x86_64 and arm64, Termux (.deb) & Linux tarballs
        run: bash scripts/package-linux.sh "${ZPANE_VERSION}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-and-termux-packages
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux-packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate unified SHA256SUMS and render Homebrew, Scoop, and WinGet manifests
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          write_sha256sums() {
            (
              cd artifacts
              rm -f SHA256SUMS SHA256SUMS.*
              local files=()
              for f in *; do
                if [[ -f "${f}" && ! -L "${f}" ]]; then
                  files+=("${f}")
                fi
              done
              if [[ ${#files[@]} -eq 0 ]]; then
                echo "Error: no release artifacts found" >&2
                exit 1
              fi
              mapfile -t sorted < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
              sha256sum -- "${sorted[@]}" > SHA256SUMS.tmp
              mv SHA256SUMS.tmp SHA256SUMS
              chmod 0644 SHA256SUMS
              sha256sum -c -- SHA256SUMS
            )
          }

          write_sha256sums

          ver="${GITHUB_REF_NAME#v}"
          src_url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${ver}.tar.gz"
          src_args=()
          if curl -fsSL --retry 3 "${src_url}" -o /tmp/zpane-source.tar.gz 2>/dev/null; then
            src_sha="$(sha256sum /tmp/zpane-source.tar.gz | awk '{print $1}')"
            src_args=(--source-sha256 "${src_sha}")
            rm -f /tmp/zpane-source.tar.gz
          fi

          python3 scripts/render-package-manifests.py \
            --version "${ver}" \
            --sums artifacts/SHA256SUMS \
            --out release-manifests \
            ${src_args[@]+"${src_args[@]}"}

          cp -f release-manifests/homebrew/zpane.rb artifacts/zpane.rb
          cp -f release-manifests/scoop/zpane.json artifacts/zpane.json
          cp -f release-manifests/winget/zenthora.zpane.yaml artifacts/zenthora.zpane.yaml
          cp -f release-manifests/winget/zenthora.zpane.installer.yaml artifacts/zenthora.zpane.installer.yaml
          cp -f release-manifests/winget/zenthora.zpane.locale.en-US.yaml artifacts/zenthora.zpane.locale.en-US.yaml
          chmod 0644 \
            artifacts/zpane.rb \
            artifacts/zpane.json \
            artifacts/zenthora.zpane.yaml \
            artifacts/zenthora.zpane.installer.yaml \
            artifacts/zenthora.zpane.locale.en-US.yaml

          write_sha256sums
      - uses: actions/upload-artifact@v4
        with:
          name: package-manager-manifests
          path: release-manifests/**
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
