[package]
name = "miller-cmd"
version = "0.1.0"
edition = "2021"
description = "Blazing-fast 3-pane Miller Column Command, Subcommand & Variable Explorer for PowerShell"

[dependencies]
anyhow = "1.0"
crossterm = "0.29.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
