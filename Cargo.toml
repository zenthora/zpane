[package]
name = "zpane"
version = "0.5.2"
edition = "2021"
authors = ["zenthora <105382125+zenthora@users.noreply.github.com>"]
description = "Blazing-fast 3-pane Miller Column Command, Subcommand, Parameter & Variable Explorer for PowerShell, Linux, and Termux"
readme = "README.md"
license = "MIT"
homepage = "https://github.com/zenthora/zpane"
repository = "https://github.com/zenthora/zpane"
keywords = ["powershell", "tui", "miller-columns", "cli", "autocomplete"]
categories = ["command-line-utilities", "command-line-interface"]
exclude = [
    ".agents/",
    ".github/",
    "docs/agents/",
    "packaging/",
    "scripts/",
    "skills-lock.json",
    "prek.toml",
    "cliff.toml",
    "AGENTS.md",
]

[dependencies]
anyhow = "1.0"
crossterm = "0.29.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "zenthora <105382125+zenthora@users.noreply.github.com>"
copyright = "2026, zenthora <105382125+zenthora@users.noreply.github.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
zpane is a 3-pane Miller column command, subcommand, parameter, and \
environment variable explorer for PowerShell and POSIX shells (Bash, Zsh, Fish, Termux)."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/zpane", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/zpane/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/zpane", dest = "/usr/bin/zpane", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/zpane/README.md", mode = "0644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/zpane/LICENSE", mode = "0644", doc = true },
]
