[package]
name = "miller-cmd"
version = "0.1.0"
edition = "2021"
authors = ["zenthora <105382125+zenthora@users.noreply.github.com>"]
description = "Blazing-fast 3-pane Miller Column Command, Subcommand & Variable Explorer for PowerShell"
readme = "README.md"
license = "MIT"
repository = "https://github.com/zenthora/miller-cmd"
keywords = ["powershell", "tui", "miller-columns", "cli", "autocomplete"]
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
anyhow = "1.0"
crossterm = "0.29.0"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
