<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="zpane 3-pane Miller column terminal explorer demo">
  <style>
    .bg { fill: #11131a; }
    .chrome { fill: #181b24; }
    .border { stroke: #31384a; stroke-width: 1.5; fill: none; }
    .sep { stroke: #2b3244; stroke-width: 1.2; }
    .title { fill: #9aa5ce; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .hdr { fill: #7aa2f7; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
    .hdr-dim { fill: #565f89; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
    .txt { fill: #c0caf5; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .muted { fill: #7882a6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; }
    .sel-bg { fill: #26314c; }
    .sel-txt { fill: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
    .badge-cli { fill: #9ece6a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .badge-sub { fill: #7dcfff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .badge-param { fill: #e0af68; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .badge-flag { fill: #bb9af7; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .badge-env { fill: #f7768e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .prompt { fill: #9ece6a; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; font-weight: 700; }
    .footer { fill: #6b7499; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .frame1 { animation: step1 9s infinite; }
    .frame2 { animation: step2 9s infinite; }
    .frame3 { animation: step3 9s infinite; }
    @keyframes step1 {
      0%, 31% { opacity: 1; }
      33%, 98% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes step2 {
      0%, 31% { opacity: 0; }
      33%, 64% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes step3 {
      0%, 64% { opacity: 0; }
      66%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <!-- Window Frame -->
  <rect x="0" y="0" width="920" height="420" rx="10" class="bg"/>
  <rect x="0" y="0" width="920" height="36" rx="10" class="chrome"/>
  <rect x="0" y="24" width="920" height="12" class="chrome"/>
  <circle cx="22" cy="18" r="6" fill="#f7768e"/>
  <circle cx="42" cy="18" r="6" fill="#e0af68"/>
  <circle cx="62" cy="18" r="6" fill="#9ece6a"/>
  <text x="460" y="22" text-anchor="middle" class="title">zpane — 3-pane Miller column command explorer (Alt+m in pwsh / zsh / bash / fish)</text>
  <line x1="0" y1="36" x2="920" y2="36" class="sep"/>

  <!-- Outer TUI Box & Column Separators -->
  <rect x="16" y="48" width="888" height="354" rx="6" class="border"/>
  <line x1="274" y1="48" x2="274" y2="318" class="sep"/>
  <line x1="566" y1="48" x2="566" y2="318" class="sep"/>
  <line x1="16" y1="78" x2="904" y2="78" class="sep"/>
  <line x1="16" y1="318" x2="904" y2="318" class="sep"/>

  <!-- Shared Footer -->
  <text x="28" y="388" class="footer">[↑/↓|Ctrl+N/P] Move  [←/→] Slide Pane  [Tab] Append Token  [F1] Inspector  [Ctrl+R] Refresh  [Enter] Inject into Prompt</text>

  <!-- FRAME 1: Pane 1 Command Selection (git [CLI]) -->
  <g class="frame1">
    <text x="28" y="68" class="hdr">1. Command / Scope (4821)</text>
    <text x="286" y="68" class="hdr-dim">2. Subcommands &amp; Flags (24)</text>
    <text x="578" y="68" class="hdr-dim">3. Inspector &amp; Info</text>

    <text x="28" y="102" class="txt">  $env:Variables</text><text x="226" y="102" class="badge-env">[Env]</text>
    <text x="28" y="128" class="txt">  cargo</text><text x="226" y="128" class="badge-cli">[CLI]</text>
    <rect x="20" y="138" width="250" height="24" rx="3" class="sel-bg"/>
    <text x="28" y="154" class="sel-txt">❯ git</text><text x="226" y="154" class="badge-cli">[CLI]</text>
    <text x="28" y="180" class="txt">  Get-Process</text><text x="210" y="180" class="badge-sub">[Cmdlet]</text>
    <text x="28" y="206" class="txt">  gh</text><text x="226" y="206" class="badge-cli">[CLI]</text>
    <text x="28" y="232" class="txt">  rg</text><text x="226" y="232" class="badge-cli">[CLI]</text>
    <text x="28" y="258" class="txt">  winget</text><text x="226" y="258" class="badge-cli">[CLI]</text>

    <text x="286" y="102" class="txt">  add</text><text x="514" y="102" class="badge-sub">[Subcmd]</text>
    <text x="286" y="128" class="txt">  branch</text><text x="514" y="128" class="badge-sub">[Subcmd]</text>
    <text x="286" y="154" class="txt">  checkout</text><text x="514" y="154" class="badge-sub">[Subcmd]</text>
    <text x="286" y="180" class="txt">  commit</text><text x="514" y="180" class="badge-sub">[Subcmd]</text>
    <text x="286" y="206" class="txt">  diff</text><text x="514" y="206" class="badge-sub">[Subcmd]</text>
    <text x="286" y="232" class="txt">  rebase</text><text x="514" y="232" class="badge-sub">[Subcmd]</text>
    <text x="286" y="258" class="txt">  status</text><text x="514" y="258" class="badge-sub">[Subcmd]</text>

    <text x="578" y="102" class="hdr">ℹ git [CLI]</text>
    <text x="578" y="128" class="muted">The stupid content tracker</text>
    <text x="578" y="154" class="muted">Branch: main (detected)</text>
    <text x="578" y="180" class="muted">Press → to drill into subcommands</text>

    <text x="28" y="342" class="muted">Filter (Pane 1):</text><text x="158" y="342" class="txt">gi█</text><text x="770" y="342" class="muted">[Step 1/3]</text>
    <text x="28" y="365" class="muted">Command Line  :</text><text x="158" y="365" class="prompt">git</text>
  </g>

  <!-- FRAME 2: Slid Right into `git commit` Flags & Params -->
  <g class="frame2">
    <text x="28" y="68" class="hdr-dim">1. git (24)</text>
    <text x="286" y="68" class="hdr">2. commit Flags &amp; Params (16)</text>
    <text x="578" y="68" class="hdr-dim">3. Values &amp; Inspector</text>

    <text x="28" y="102" class="txt">  add</text><text x="218" y="102" class="badge-sub">[Subcmd]</text>
    <text x="28" y="128" class="txt">  branch</text><text x="218" y="128" class="badge-sub">[Subcmd]</text>
    <rect x="20" y="138" width="250" height="24" rx="3" class="sel-bg"/>
    <text x="28" y="154" class="sel-txt">❯ commit</text><text x="218" y="154" class="badge-sub">[Subcmd]</text>
    <text x="28" y="180" class="txt">  diff</text><text x="218" y="180" class="badge-sub">[Subcmd]</text>
    <text x="28" y="206" class="txt">  log</text><text x="218" y="206" class="badge-sub">[Subcmd]</text>
    <text x="28" y="232" class="txt">  push</text><text x="218" y="232" class="badge-sub">[Subcmd]</text>

    <text x="286" y="102" class="txt">  -a (-all)</text><text x="518" y="102" class="badge-flag">[Flag]</text>
    <text x="286" y="128" class="txt">  --amend</text><text x="518" y="128" class="badge-flag">[Flag]</text>
    <rect x="278" y="138" width="284" height="24" rx="3" class="sel-bg"/>
    <text x="286" y="154" class="sel-txt">❯ -m &lt;msg&gt; (--message)</text><text x="510" y="154" class="badge-param">[Param]</text>
    <text x="286" y="180" class="txt">  -S (--gpg-sign)</text><text x="510" y="180" class="badge-param">[Param]</text>
    <text x="286" y="206" class="txt">  -s (--signoff)</text><text x="518" y="206" class="badge-flag">[Flag]</text>
    <text x="286" y="232" class="txt">  --fixup &lt;commit&gt;</text><text x="510" y="232" class="badge-param">[Param]</text>

    <text x="578" y="102" class="hdr">ℹ -m &lt;msg&gt; (--message) [Param]</text>
    <text x="578" y="128" class="muted">Use the given &lt;msg&gt; as the commit</text>
    <text x="578" y="148" class="muted">message. Can be given multiple times.</text>
    <line x1="578" y1="166" x2="892" y2="166" class="sep"/>
    <text x="578" y="190" class="txt">✏ Type custom value</text><text x="844" y="190" class="badge-sub">[Value]</text>
    <text x="578" y="216" class="txt">  $env:GIT_AUTHOR_NAME</text><text x="852" y="216" class="badge-env">[Var]</text>

    <text x="28" y="342" class="muted">Filter (Pane 2):</text><text x="158" y="342" class="txt">-m█</text><text x="770" y="342" class="muted">[Step 2/3]</text>
    <text x="28" y="365" class="muted">Command Line  :</text><text x="158" y="365" class="prompt">git commit -m</text>
  </g>

  <!-- FRAME 3: Pane 3 Value & Prompt Injection Ready -->
  <g class="frame3">
    <text x="28" y="68" class="hdr-dim">1. git commit</text>
    <text x="286" y="68" class="hdr-dim">2. -m &lt;msg&gt; [Param]</text>
    <text x="578" y="68" class="hdr">3. Custom Value / Vars (4)</text>

    <text x="28" y="102" class="txt">  --amend</text><text x="226" y="102" class="badge-flag">[Flag]</text>
    <rect x="20" y="112" width="250" height="24" rx="3" class="sel-bg"/>
    <text x="28" y="128" class="sel-txt">❯ -m &lt;msg&gt;</text><text x="218" y="128" class="badge-param">[Param]</text>
    <text x="28" y="154" class="txt">  -s (--signoff)</text><text x="226" y="154" class="badge-flag">[Flag]</text>

    <text x="286" y="102" class="hdr">ℹ Argument Value</text>
    <text x="286" y="128" class="muted">Type literal value or pick variable</text>
    <text x="286" y="154" class="muted">Quotes added automatically per shell</text>
    <text x="286" y="180" class="muted">Dialect: pwsh / zsh / bash / fish</text>

    <rect x="570" y="86" width="326" height="24" rx="3" class="sel-bg"/>
    <text x="578" y="102" class="sel-txt">❯ ✏ Use "feat: add CLI"</text><text x="844" y="102" class="badge-sub">[Value]</text>
    <text x="578" y="128" class="txt">  $PWD</text><text x="854" y="128" class="badge-env">[Var]</text>
    <text x="578" y="154" class="txt">  $HOME</text><text x="854" y="154" class="badge-env">[Var]</text>
    <text x="578" y="180" class="txt">  HEAD</text><text x="844" y="180" class="badge-sub">[Value]</text>

    <text x="28" y="342" class="muted">Filter (Pane 3):</text><text x="158" y="342" class="txt">feat: add CLI█</text><text x="770" y="342" class="muted">[Step 3/3]</text>
    <text x="28" y="365" class="muted">Command Line  :</text><text x="158" y="365" class="prompt">git commit -m 'feat: add CLI'</text>
  </g>
</svg>
